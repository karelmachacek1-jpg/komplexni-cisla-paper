env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo FIRST (needed for pushing later)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Clean up old artifacts (safer version)
      - name: Delete Old Artifacts
        uses: actions/github-script@v6
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            for (const artifact of artifacts.data.artifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

      # Fetch latest files from Overleaf
      - name: Fetch from Overleaf
        uses: karelmachacek1-jpg/overleaf_sync_with_git@v1
        with:
          OVERLEAF_PROJECT_ID: ${{ secrets.aOVERLEAF_PROJECT_ID }}
          OVERLEAF_COOKIE: ${{ secrets.aOVERLEAF_COOKIE }}

      # Upload artifact (optional)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: overleaf-project
          path: ./artifacts/

      # Sync files into repo
      - name: Copy files into repo
        run: |
          mkdir -p overleaf_remote_src
          cp -r artifacts/* overleaf_remote_src/ || true

      # Commit & push if changes exist
      - name: Commit and push changes
        run: |
          git config user.name "Overleaf Sync Bot"
          git config user.email "overleaf-bot@github.com"

          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-sync from Overleaf $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
